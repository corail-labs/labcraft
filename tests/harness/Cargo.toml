[package]
name = "labcraft-harness"
description = "Acceptance corpora run against the crates, natively and in WASM"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
labcraft-check = { workspace = true }
labcraft-format = { workspace = true }
labcraft-graph = { workspace = true }
labcraft-types = { workspace = true }

[dev-dependencies]
# `serde`: the drawings that cross from the worker to the page of the web viewer.
labcraft-diagram = { workspace = true, features = ["serde"] }
labcraft-engine = { workspace = true }
labcraft-ir = { workspace = true }
labcraft-libs = { workspace = true }
labcraft-runtime = { workspace = true }
labcraft-trace = { workspace = true }
labcraft-visa = { workspace = true }
postcard = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
egui = { workspace = true }
labcraft-editor = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = { workspace = true }

[lints]
workspace = true
