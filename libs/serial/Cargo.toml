[package]
name = "labcraft-serial"
description = "The native bodies of the LabCraft library serial: serial ports over serial2, and the devices of a simulation file"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
labcraft-runtime = { workspace = true }
labcraft-types = { workspace = true }
toml = { workspace = true }

# `serial2` does not build for `wasm32`: there, every open gives `io.unsupported` (io.md 3).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
serial2 = { workspace = true }

[lints]
workspace = true
