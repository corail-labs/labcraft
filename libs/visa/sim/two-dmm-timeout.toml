# As `two-dmm.toml`, but the multimeter of branch A, SIM::DMM0, never answers its measure (scenario 3).
[[visa.instrument]]
resource = "SIM::DMM0"
idn = "SIM,DMM,0,1.0"

[visa.instrument.measure]
"MEAS:VOLT:DC?" = "voltage"

[visa.instrument.quantity.voltage]
value = 230.0
noise = 0.05
seed = 1

[visa.instrument.faults]
timeout = ["MEAS:VOLT:DC?"]

[[visa.instrument]]
resource = "SIM::DMM1"
idn = "SIM,DMM,1,1.0"

[visa.instrument.measure]
"MEAS:VOLT:DC?" = "voltage"

[visa.instrument.quantity.voltage]
value = 12.0
noise = 0.01
seed = 2
