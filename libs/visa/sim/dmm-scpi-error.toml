# The measurement succeeds but the instrument reports an SCPI error in its queue (SYST:ERR?).
[[visa.instrument]]
resource = "SIM::DMM0"

[visa.instrument.measure]
"MEAS:VOLT:DC?" = "voltage"

[visa.instrument.quantity.voltage]
value = 230.0

[visa.instrument.faults]
error_queue = [[-221, "Settings conflict"], [-113, "Undefined header"]]
