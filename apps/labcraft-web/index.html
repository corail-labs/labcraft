<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="LabCraft, a graphical dataflow language in pure Rust: its viewer, in the browser.">
  <title>LabCraft viewer</title>
  <!-- The page and the worker of its session (docs/architecture.md, 11.5), built by `cargo xtask web`. -->
  <link data-trunk rel="rust" href="Cargo.toml" data-bin="labcraft-web" data-type="main" data-wasm-opt="z" data-weak-refs />
  <link data-trunk rel="rust" href="Cargo.toml" data-bin="labcraft-worker" data-type="worker" data-wasm-opt="z" data-weak-refs data-loader-shim />
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #f4f4f2; color: #202020; }
    @media (prefers-color-scheme: dark) { html, body { background: #1c1c1e; color: #e4e4e4; } }
    canvas { display: block; width: 100%; height: 100%; }
    #loading { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 14px; align-items: center;
               justify-content: center; padding: 16px; font: 16px system-ui, sans-serif; text-align: center; }
    #loading .what { opacity: 0.7; font-size: 14px; }
    #loading .spin { width: 22px; height: 22px; border: 3px solid currentColor; border-right-color: transparent;
                     border-radius: 50%; opacity: 0.6; animation: spin 0.9s linear infinite; }
    @media (prefers-reduced-motion: reduce) { #loading .spin { animation-duration: 3s; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading a { color: inherit; }
  </style>
</head>
<body>
  <canvas id="labcraft"></canvas>
  <div id="loading">
    <div class="spin" aria-hidden="true"></div>
    <div><strong>LabCraft</strong>, a graphical dataflow language: loading its viewer…</div>
    <div class="what">It runs in your browser, and the files you open stay there.</div>
    <noscript>The viewer needs JavaScript and WebAssembly.</noscript>
  </div>
  <script>
    // What stops the viewer before it starts is said where it loads (the page itself says why eframe failed).
    (function () {
      var loading = document.getElementById('loading');
      function fail(why) {
        if (!loading.isConnected || loading.hasAttribute('data-failed')) return;
        loading.setAttribute('data-failed', '');
        loading.textContent = '';
        var line = document.createElement('div');
        line.textContent = 'LabCraft could not start: ' + why + '. It needs a recent browser with WebAssembly, and WebGPU or WebGL2.';
        var link = document.createElement('a');
        link.href = 'https://github.com/corail-labs/labcraft';
        link.textContent = 'LabCraft on GitHub';
        loading.append(line, link);
      }
      if (typeof WebAssembly !== 'object') fail('this browser has no WebAssembly');
      window.addEventListener('error', function (event) {
        fail(event.message || ('a file did not load: ' + ((event.target && (event.target.src || event.target.href)) || 'unknown')));
      }, true);
      window.addEventListener('unhandledrejection', function (event) { fail(String(event.reason)); });
    })();
  </script>
</body>
</html>
