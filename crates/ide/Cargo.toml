[package]
name = "labcraft-ide"
description = "LabCraft L8: the window of the IDE, once for the desktop and the web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
craft-keymap = { workspace = true }
craft-menu = { workspace = true }
craft-ui = { workspace = true, features = ["serde"] }
craft-window = { workspace = true }
egui = { workspace = true }
kit-shell = { workspace = true }
labcraft-editor = { workspace = true }
labcraft-engine = { workspace = true }
labcraft-format = { workspace = true }
labcraft-types = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[features]
default = []
# The tab of a function detaches into a window of the system (ide.md 9): the desktop app turns it on; the web, which has
# one window of the browser, floats it in the page.
native-windows = ["craft-ui/native-windows"]

[dev-dependencies]
egui_kittest = { workspace = true }

[lints]
workspace = true
