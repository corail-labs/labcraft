# Outside the workspace of the root: this needs nightly, and the product builds on stable
# (`docs/architecture.md`, section 8). So it has its own Cargo.lock.
[package]
name = "labcraft-fuzz"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
labcraft-check = { path = "../crates/check" }
labcraft-diagram = { path = "../crates/diagram" }
labcraft-engine = { path = "../crates/engine" }
labcraft-format = { path = "../crates/format" }
labcraft-graph = { path = "../crates/graph" }
labcraft-libs = { path = "../libs/embedded" }
labcraft-mcp = { path = "../crates/mcp" }
labcraft-runtime = { path = "../crates/runtime" }
labcraft-types = { path = "../crates/types" }
labcraft-visa = { path = "../libs/visa" }
libfuzzer-sys = "0.4"
# `unbounded_depth`: the target `mcp` reads a request as deep as the server does, beyond the 128 levels of serde_json.
serde_json = { version = "1", features = ["unbounded_depth"] }

[[bin]]
name = "read"
path = "fuzz_targets/read.rs"
test = false
doc = false
bench = false

[[bin]]
name = "round_trip"
path = "fuzz_targets/round_trip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "check"
path = "fuzz_targets/check.rs"
test = false
doc = false
bench = false

[[bin]]
name = "diagram"
path = "fuzz_targets/diagram.rs"
test = false
doc = false
bench = false

[[bin]]
name = "simulation"
path = "fuzz_targets/simulation.rs"
test = false
doc = false
bench = false

[[bin]]
name = "run"
path = "fuzz_targets/run.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mcp"
path = "fuzz_targets/mcp.rs"
test = false
doc = false
bench = false
