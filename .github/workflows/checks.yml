name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to a pull request replaces its older run; every push to main runs to the end.
concurrency:
  group: checks-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # One job for the whole gate, so that the check required on main stays `checks`.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - run: pip install -r tools/lcf-poc/requirements.txt
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update \
            --component clippy --component rustfmt --target wasm32-unknown-unknown
          rustup default stable
      # Only main saves the cache; pull requests restore it.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The list of the Python checks is in xtask/src/spec.rs.
      - name: Python checks
        run: cargo xtask spec
      # The runner must have the version of wasm-bindgen that Cargo.lock gives the tests.
      - name: Version of the WASM test runner
        id: wasm-bindgen
        run: |
          version=$(cargo metadata --locked --format-version 1 | jq -r '[.packages[] | select(.name == "wasm-bindgen") | .version][0]')
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: wasm-bindgen@${{ steps.wasm-bindgen.outputs.version }}
      - name: Rust gate
        run: cargo xtask ci
      # A figure, never a threshold (docs/visual-notation.md, 2.1 and 7): it never turns the job red.
      - name: Figures of the viewer
        continue-on-error: true
        run: cargo xtask figures >> "$GITHUB_STEP_SUMMARY"

  # Paths, walking folders and atomic writes differ on Windows. The crates are the same everywhere, and
  # the gate above covers them, so this runs only what touches the file system.
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Command line and viewer tests
        run: cargo test --locked -p labcraft-cli -p labcraft-libs -p labcraft -- --include-ignored
