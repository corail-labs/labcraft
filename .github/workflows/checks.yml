name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to a pull request replaces its older run; every push to main runs to the end.
concurrency:
  group: checks-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # One job, so that the check required on main stays `checks`.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: pip install -r tools/lcf-poc/requirements.txt
      - name: Grammar, examples and spec code blocks
        run: python tools/lcf-view/lcf_view.py examples libs --spec docs/language-spec-v0.md
      - name: Check the libraries
        run: |
          python tools/lcf-poc/lcf.py check examples
          python tools/lcf-poc/lcf.py check docs/rfc
          python tools/lcf-poc/lcf.py check libs/visa
          python tools/lcf-poc/lcf.py check libs/scpi
      - name: Canonical form
        run: python tools/lcf-poc/lcf.py fmt --check --spec docs/language-spec-v0.md examples docs/rfc libs
      - name: Proof of concept tests
        run: python -m unittest discover tools/lcf-poc/tests
      - name: MCP round trip
        run: python tools/lcf-poc/tests/mcp_smoke.py
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update \
            --component clippy --component rustfmt --target wasm32-unknown-unknown
          rustup default stable
      # Only main saves the cache; pull requests restore it.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The runner must have the version of wasm-bindgen that Cargo.lock gives the tests.
      - name: Version of the WASM test runner
        id: wasm-bindgen
        run: |
          version=$(cargo metadata --locked --format-version 1 | jq -r '[.packages[] | select(.name == "wasm-bindgen") | .version][0]')
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: wasm-bindgen@${{ steps.wasm-bindgen.outputs.version }}
      - name: Rust gate
        run: cargo xtask ci
