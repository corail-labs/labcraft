name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to a pull request replaces its older run; every push to main runs to the end.
concurrency:
  group: checks-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The parts of `cargo xtask ci` run side by side, one job each, so that a pull request waits for the longest part only.
# Each job keeps a cache of its own, since their builds differ (clippy, tests, release and WASM).
jobs:
  # A pull request that changes only prose skips the jobs that build and run code; lint always runs, since it checks
  # the documents too. The rule is in the script.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.changes.outputs.code }}
    steps:
      # The merge commit and its first parent, the base: the script compares the two.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Does the pull request change code
        id: changes
        env:
          EVENT: ${{ github.event_name }}
        run: bash .github/scripts/code-changed.sh checks

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      # rust-toolchain.toml pins the version, so that a new stable neither empties the caches nor brings new lints.
      - name: Install Rust
        run: rustup toolchain install --no-self-update
      # Only main saves the cache; pull requests restore it.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The hook of the agents is Python, standard library only (xtask/src/hooks.rs).
      - name: Tests of the hooks
        run: cargo xtask hooks
      - name: Formatting, repository checks and clippy
        run: cargo xtask lint

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Runs the test binaries side by side; `cargo xtask test` falls back to `cargo test` without it.
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-nextest@0.9.150
      - name: Tests
        run: cargo xtask test

  release:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The runner must have the version of wasm-bindgen that Cargo.lock gives the tests.
      - name: Version of the WASM test runner
        id: wasm-bindgen
        run: |
          version=$(cargo metadata --locked --format-version 1 | jq -r '[.packages[] | select(.name == "wasm-bindgen") | .version][0]')
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: wasm-bindgen@${{ steps.wasm-bindgen.outputs.version }}
      - name: Bounds, in release
        run: cargo xtask bounds
      - name: WASM
        run: cargo xtask wasm
      # The figures, in the summary; from M1 a threshold too (scenario 5 of docs/acceptance-m1.md, point 2): a figure of
      # stability worse than at the tag v0.3.0-m0 turns the job red.
      - name: Figures of the viewer
        run: cargo xtask figures --against tests/figures/m1-shift.md >> "$GITHUB_STEP_SUMMARY"

  # The web viewer (docs/architecture.md, 11.5): clippy for WASM and the build of Trunk, then the page in headless Chrome,
  # which draws, traps its worker and draws again. The site built is kept, to download: nothing is hosted (owner, 2026-11-13).
  web:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The version that xtask/src/web.rs names; Trunk fetches wasm-bindgen and wasm-opt itself.
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: trunk@0.21.14
      - name: Clippy for WASM, and the build
        run: cargo xtask web
      - name: The page in headless Chrome
        run: cargo xtask web-smoke
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: labcraft-web
          path: target/web
          retention-days: 14

  # The check required on main runs even when a part failed or was cancelled, since a skipped required check counts as passed.
  # A part may be skipped only when changes said the pull request is prose alone.
  checks:
    if: always()
    needs: [changes, lint, test, release, web]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every part passed
        env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          LINT: ${{ needs.lint.result }}
          TEST: ${{ needs.test.result }}
          RELEASE: ${{ needs.release.result }}
          WEB: ${{ needs.web.result }}
        run: |
          echo "changes: $CHANGES (code: $CODE), lint: $LINT, test: $TEST, release: $RELEASE, web: $WEB"
          passed() { [ "$1" = success ] || { [ "$CODE" = false ] && [ "$1" = skipped ]; }; }
          [ "$CHANGES" = success ] && [ "$LINT" = success ] && passed "$TEST" && passed "$RELEASE" && passed "$WEB"

  # Paths, walking folders and atomic writes differ on Windows. The crates are the same everywhere, and
  # the jobs above cover them, so this runs only what touches the file system.
  windows:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Command line and viewer tests
        run: cargo test --locked -p labcraft-cli -p labcraft-libs -p labcraft -- --include-ignored
