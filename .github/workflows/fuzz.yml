name: fuzz

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to a pull request replaces its older run; every push to main runs to the end.
concurrency:
  group: fuzz-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A workflow of its own on a pinned nightly, so that `checks` stays on stable (docs/architecture.md, section 8).
  # Scenario 4: each target runs 60 s in each CI run.
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The version of rust-toolchain.toml, for xtask.
      - name: Install Rust
        run: rustup toolchain install --no-self-update
      - name: Install the pinned nightly
        working-directory: fuzz
        run: rustup toolchain install --no-self-update
      # Only main saves the cache; pull requests restore it. Both workspaces: xtask for the licences, the targets of
      # fuzz/. It also keeps ~/.cargo/bin, so cargo install finds cargo-fuzz already there.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            . -> target
            fuzz -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Also says when fuzz/Cargo.lock is out of date: cargo fuzz would rewrite it without a word.
      - name: Licences of fuzz/
        run: cargo xtask fuzz-licences
      # Whatever ran cargo before (the cache step too) must not have rewritten a stale lock without a word.
      - name: fuzz/Cargo.lock unchanged
        run: git diff --exit-code fuzz/Cargo.lock
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Formatting of fuzz/
        working-directory: fuzz
        run: cargo fmt --check
      # Built once, before any clock starts, so that run.sh finds the targets and deep_seeds already built.
      - name: Build the targets and the seeds
        working-directory: fuzz
        run: |
          cargo build --locked --bin deep_seeds
          cargo fuzz build
      # At most four at a time, the vCPUs of the runner, so that two targets never share one.
      - name: Fuzz the parser, the round trip of fmt, check and diagram
        run: bash fuzz/side_by_side.sh 60 read round_trip check diagram
      - name: Fuzz the simulation files, runs and the MCP server
        run: bash fuzz/side_by_side.sh 60 simulation run mcp
      - name: Keep what crashed
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
          if-no-files-found: ignore
