name: release

# A tag `v<version>` builds `labcraft-cli` and `labcraft` on each platform, and the web viewer, and makes a draft release
# with them and the note `docs/releases/<tag>.md`: the owner reads the draft, then publishes it (2026-11-14). A pull
# request that changes this file, or a run by hand, builds and packages the same way, without a release.
on:
  push:
    tags: ['v*']
  pull_request:
    paths: ['.github/workflows/release.yml', 'docs/releases/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# No cache: a release is rare, and a clean build is the one we ship.
jobs:

  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The version of `[workspace.package]`, the first `version =` of Cargo.toml; a tag must name it, and its note must exist. Between two
      # tags it ends in `-dev` and has no note (architecture.md 8).
      - name: The version, the tag and the note
        id: read
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -eu
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          [ -n "$version" ] || { echo "::error::no version in Cargo.toml"; exit 1; }
          if [ "$REF_TYPE" = tag ]; then
            if [ "$REF_NAME" != "v$version" ]; then
              echo "::error::the tag $REF_NAME does not name the version $version of Cargo.toml"
              exit 1
            fi
            [ -f "docs/releases/v$version.md" ] || { echo "::error::docs/releases/v$version.md is missing"; exit 1; }
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.name }})
    needs: [version]
    runs-on: ${{ matrix.os }}
    # Windows waits up to an hour for each of its two requests of signing (below).
    timeout-minutes: ${{ matrix.name == 'windows-x64' && 180 || 60 }}
    # SignPath downloads the artifact to sign with the token of the job, which needs to read the artifacts.
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04: glibc 2.35, so that the binaries also start on older distributions.
          - { name: linux-x64, os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, exe: '' }
          - { name: windows-x64, os: windows-latest, target: x86_64-pc-windows-msvc, exe: .exe }
          - { name: macos-arm64, os: macos-15, target: aarch64-apple-darwin, exe: '' }
          # Built on the same Apple Silicon runner, and tried there through Rosetta.
          - { name: macos-x64, os: macos-15, target: x86_64-apple-darwin, exe: '' }
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      # Windows: the C runtime linked in, so that the binaries need no Visual C++ redistributable.
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
      VERSION: ${{ needs.version.outputs.version }}
      TARGET: ${{ matrix.target }}
      EXE: ${{ matrix.exe }}
      # `labcraft.exe` of a release always has its icon (apps/labcraft/build.rs).
      LABCRAFT_REQUIRE_ICON: 1
      NAME: labcraft-${{ needs.version.outputs.version }}-${{ matrix.name }}
      # Windows is signed through SignPath on a tag pushed, once the secret of its API token exists; without it (a fork, a
      # pull request, a run by hand, today) the steps of signing are skipped and the files are built unsigned (#255).
      SIGN: ${{ matrix.name == 'windows-x64' && github.event_name == 'push' && github.ref_type == 'tag' && secrets.SIGNPATH_API_TOKEN != '' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install --no-self-update
          rustup target add "$TARGET"
      - name: Build
        run: cargo build --release --locked --target "$TARGET" -p labcraft-cli -p labcraft
      # Signed first, so that the archive and the MSI are made from the signed binaries.
      - name: The binaries to sign
        if: env.SIGN == 'true'
        id: binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-binaries
          path: |
            target/${{ matrix.target }}/release/labcraft.exe
            target/${{ matrix.target }}/release/labcraft-cli.exe
          if-no-files-found: error
          retention-days: 1
      - name: Sign the binaries
        if: env.SIGN == 'true'
        uses: SignPath/github-action-submit-signing-request@a2c5b60d9c75f073142b653c354b632eedce097b # v3.2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: labcraft
          signing-policy-slug: release-signing
          artifact-configuration-slug: binaries
          github-artifact-id: ${{ steps.binaries.outputs.artifact-id }}
          wait-for-completion: true
          # A release-signing request waits for a maintainer to approve it on SignPath.
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: target/${{ matrix.target }}/release
      # The binaries; the licences and notices: ours, those of the fonts and the Unicode data where ATTRIBUTION.md names
      # them, those of the crates built in (`cargo xtask notices`); the programs of examples/ and the simulated
      # instruments of visa, to try them as the README and the note say.
      - name: Package
        run: |
          set -eu
          out="dist/$NAME"
          mkdir -p "$out/assets/fonts" "$out/crates/types" "$out/sim"
          cp "target/$TARGET/release/labcraft-cli$EXE" "target/$TARGET/release/labcraft$EXE" "$out/"
          cp README.md LICENSE-MIT LICENSE-APACHE NOTICE ATTRIBUTION.md "$out/"
          # The note exists on a tag (job `version`); a `-dev` version between two tags has none.
          if [ -f "docs/releases/v$VERSION.md" ]; then cp "docs/releases/v$VERSION.md" "$out/RELEASE.md"; fi
          cp assets/fonts/LICENSE-Hack.md assets/fonts/LICENSE-Inter.txt "$out/assets/fonts/"
          cp crates/types/LICENSE-Unicode.txt "$out/crates/types/"
          cargo xtask notices "$TARGET" "$out/THIRD-PARTY-LICENSES.txt"
          find examples -name '*.lcf' -o -name '*.lct' | while read -r file; do
            mkdir -p "$out/$(dirname "$file")"
            cp "$file" "$out/$file"
          done
          cp libs/visa/sim/*.toml "$out/sim/"
      # What a user types in the folder of the archive, on a copy of it, so that the trace of the run is not shipped:
      # the examples check, check_voltage runs against a simulated multimeter, the viewer starts and prints its version.
      - name: Try the archive
        run: |
          set -eu
          cp -R "dist/$NAME" try
          cd try
          ./labcraft-cli$EXE version
          ./labcraft-cli$EXE check examples
          ./labcraft-cli$EXE run --sim sim/dmm-230V.toml --arg resource=SIM::DMM0 examples check_voltage
          test -f examples/.labcraft/runs/check_voltage.trace.jsonl
          ./labcraft$EXE --version
      # The MSI, from the folder of the archive (packaging/windows/labcraft.wxs). Its version has no suffix: Windows
      # Installer reads three numbers, so `0.4.0-dev` is built as 0.4.0. WiX 5, under MS-RL alone: from 6 on, its
      # releases come with the Open Source Maintenance Fee of FireGiant, and 7 asks to accept its EULA.
      - name: MSI
        if: matrix.name == 'windows-x64'
        run: |
          set -eu
          dotnet tool install --global wix --version 5.0.2
          export PATH="$PATH:$HOME/.dotnet/tools"
          wix build -wx -arch x64 -d "Version=${VERSION%%-*}" -bindpath "Stage=$(pwd -W)/dist/$NAME" \
            -o "dist/$NAME.msi" packaging/windows/labcraft.wxs
          # ICE61 warns of AllowSameVersionUpgrades, which is meant (labcraft.wxs); every other warning fails.
          wix msi validate -wx -sice ICE61 "dist/$NAME.msi"
          rm -f "dist/$NAME.wixpdb"
      - name: The MSI to sign
        if: env.SIGN == 'true'
        id: msi
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-msi
          path: dist/${{ env.NAME }}.msi
          if-no-files-found: error
          retention-days: 1
      - name: Sign the MSI
        if: env.SIGN == 'true'
        uses: SignPath/github-action-submit-signing-request@a2c5b60d9c75f073142b653c354b632eedce097b # v3.2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: labcraft
          signing-policy-slug: release-signing
          artifact-configuration-slug: msi
          github-artifact-id: ${{ steps.msi.outputs.artifact-id }}
          wait-for-completion: true
          # A release-signing request waits for a maintainer to approve it on SignPath.
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: dist
      # What the installer does on the runner: installed silently, the two programs run from the installed folder, the
      # folder in the PATH of the system and the shortcut in the Start menu, then uninstalled, leaving none of them.
      - name: Try the MSI
        if: matrix.name == 'windows-x64'
        shell: pwsh
        run: packaging/windows/try-msi.ps1 -Msi "dist/$env:NAME.msi"
      # Valid when signed, NotSigned otherwise; anything else, or NotSigned when signing ran, fails.
      - name: Signatures
        if: matrix.name == 'windows-x64'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = "dist/$env:NAME.msi", "dist/$env:NAME/labcraft.exe", "dist/$env:NAME/labcraft-cli.exe"
          $want = if ($env:SIGN -eq 'true') { 'Valid' } else { 'NotSigned' }
          $bad = 0
          foreach ($file in $files) {
            $status = (Get-AuthenticodeSignature $file).Status
            Write-Output "$file`: $status"
            "- ``$file``: $status" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
            if ("$status" -ne $want) { $bad++ }
          }
          if ($bad) { Write-Output "::error::$bad file(s) not $want"; exit 1 }
      - name: Archive
        run: |
          set -eu
          cd dist
          if [ "$RUNNER_OS" = Windows ]; then
            7z a -tzip -bso0 "$NAME.zip" "$NAME"
            # The MSI also under a name that does not change with the version, which a link or an update finds (#331).
            if [ -f "$NAME.msi" ]; then cp "$NAME.msi" labcraft-windows-x64.msi; fi
          else
            tar -czf "$NAME.tar.gz" "$NAME"
          fi
          rm -rf "$NAME"
          ls -l
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  # The site of `cargo xtask web`, tried in headless Chrome as the job `web` of `checks` does, then zipped. Nothing is
  # hosted: the note says to serve the folder with a static server.
  web:
    needs: [version]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      NAME: labcraft-web-${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install --no-self-update
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: trunk@0.21.14
      - name: Build
        run: cargo xtask web
      - name: The page in headless Chrome
        run: cargo xtask web-smoke
      - name: Package
        run: |
          set -eu
          out="dist/$NAME"
          mkdir -p dist
          cp -R target/web "$out"
          mkdir -p "$out/assets/fonts" "$out/crates/types"
          cp LICENSE-MIT LICENSE-APACHE NOTICE ATTRIBUTION.md "$out/"
          cp assets/fonts/LICENSE-Hack.md assets/fonts/LICENSE-Inter.txt "$out/assets/fonts/"
          cp crates/types/LICENSE-Unicode.txt "$out/crates/types/"
          cargo xtask notices wasm32-unknown-unknown "$out/THIRD-PARTY-LICENSES.txt"
          cd dist
          zip -qr "$NAME.zip" "$NAME"
          rm -rf "$NAME"
          ls -l
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-web
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  # Only for a tag pushed (a run by hand on a tag makes none): a draft, marked pre-release when the version has a
  # suffix, which the owner publishes by hand. A release that exists already for the tag stops it: no second draft.
  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [version, build, web]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          set -eu
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - name: Draft release
        run: |
          set -eu
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "::error::a release of $TAG exists already: delete it, or publish it, before running this again"
            exit 1
          fi
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" --draft $prerelease --verify-tag \
            --title "LabCraft $VERSION" --notes-file "docs/releases/$TAG.md" dist/*
