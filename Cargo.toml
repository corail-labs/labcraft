[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "libs/embedded", "libs/visa", "examples/results_log", "tests/harness", "xtask"]

[workspace.package]
version = "0.3.0-m0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
# internal
labcraft-types = { path = "crates/types" }
labcraft-graph = { path = "crates/graph" }
labcraft-format = { path = "crates/format" }
labcraft-check = { path = "crates/check" }
labcraft-trace = { path = "crates/trace" }
labcraft-ir = { path = "crates/ir" }
labcraft-runtime = { path = "crates/runtime" }
labcraft-diagram = { path = "crates/diagram" }
labcraft-engine = { path = "crates/engine" }
labcraft-mcp = { path = "crates/mcp" }
labcraft-editor = { path = "crates/editor" }
labcraft-cli = { path = "apps/labcraft-cli" }
labcraft-libs = { path = "libs/embedded" }
labcraft-visa = { path = "libs/visa" }
labcraft-results-log = { path = "examples/results_log" }

# Every crate of craft-libs comes from one revision, as in the Craft apps.
craft-atomic = { git = "https://github.com/storytold/craft-libs", rev = "2e2312ddaf21bc3d85cd3395d0955c7d239306f6" }
craft-dialogs = { git = "https://github.com/storytold/craft-libs", rev = "2e2312ddaf21bc3d85cd3395d0955c7d239306f6" }
craft-settings = { git = "https://github.com/storytold/craft-libs", rev = "2e2312ddaf21bc3d85cd3395d0955c7d239306f6" }
craft-ui = { git = "https://github.com/storytold/craft-libs", rev = "2e2312ddaf21bc3d85cd3395d0955c7d239306f6", features = ["system_fonts"] }

# The suite's fork of egui, at the revision that craft-libs pins (`[patch.crates-io]` below). No default fonts:
# the canvas and the app install their own (architecture 11.5).
egui = { version = "0.37", default-features = false }
eframe = { version = "0.37", default-features = false, features = ["accesskit", "clipboard", "wayland", "wgpu", "x11"] }

# foundation
ctrlc = "3.4"
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
postcard = { version = "1", default-features = false, features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
toml = { version = "1", default-features = false, features = ["parse", "serde"] }
toml_parser = { version = "1", default-features = false }
unicode-normalization = "0.1"
unicode-properties = { version = "0.1", default-features = false, features = ["general-category"] }

# tooling
serde_json = { version = "1", features = ["preserve_order"] }
zmij = "1"
wasm-bindgen-test = "0.3"

# The web viewer (apps/labcraft-web), in the browser only.
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = "0.3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

# Dependencies are optimized and our crates are not: tests stay quick to build and quick to run.
[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.dev]
debug = "line-tables-only"

[profile.release]
# `check` reports a bug on one function as LC0099 and goes on, under catch_unwind (architecture, 5).
panic = "unwind"
lto = "thin"

# The egui of the Craft suite: the fork at the revision of craft-libs (architecture 11.4).
[patch.crates-io]
ecolor = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
emath = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
eframe = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui-winit = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui-wgpu = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
winit = { git = "https://github.com/storytold/winit.git", rev = "a517b3846ee8457d84ee4975110bfda6797c44dc" }
