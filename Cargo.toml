[workspace]
resolver = "3"
members = ["crates/*", "kit/*", "apps/*", "libs/embedded", "libs/net", "libs/visa", "examples/results_log", "tests/harness", "xtask"]

[workspace.package]
version = "0.4.0-dev"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
# internal
labcraft-types = { path = "crates/types" }
labcraft-graph = { path = "crates/graph" }
labcraft-format = { path = "crates/format" }
labcraft-check = { path = "crates/check" }
labcraft-edit = { path = "crates/edit" }
labcraft-trace = { path = "crates/trace" }
labcraft-ir = { path = "crates/ir" }
labcraft-runtime = { path = "crates/runtime" }
labcraft-diagram = { path = "crates/diagram" }
labcraft-engine = { path = "crates/engine" }
labcraft-mcp = { path = "crates/mcp" }
labcraft-editor = { path = "crates/editor" }
labcraft-ide = { path = "crates/ide" }
labcraft-cli = { path = "apps/labcraft-cli" }
labcraft-libs = { path = "libs/embedded" }
labcraft-net = { path = "libs/net" }
labcraft-visa = { path = "libs/visa" }
labcraft-results-log = { path = "examples/results_log" }

# kit: the pieces of the window for any IDE (ide.md 11)
kit-shell = { path = "kit/kit-shell" }
kit-text = { path = "kit/kit-text" }
kit-text-egui = { path = "kit/kit-text-egui" }

# Every crate of craft-libs comes from one revision, as in the Craft apps.
craft-atomic = { git = "https://github.com/corail-labs/craft-libs", rev = "5ee3df0f6a9b0fbb55718515bce9d5eb5ab8d1db" }
craft-dialogs = { git = "https://github.com/corail-labs/craft-libs", rev = "5ee3df0f6a9b0fbb55718515bce9d5eb5ab8d1db" }
craft-keymap = { git = "https://github.com/corail-labs/craft-libs", rev = "5ee3df0f6a9b0fbb55718515bce9d5eb5ab8d1db", features = ["egui"] }
craft-menu = { git = "https://github.com/corail-labs/craft-libs", rev = "5ee3df0f6a9b0fbb55718515bce9d5eb5ab8d1db" }
craft-settings = { git = "https://github.com/corail-labs/craft-libs", rev = "5ee3df0f6a9b0fbb55718515bce9d5eb5ab8d1db" }
craft-ui = { git = "https://github.com/corail-labs/craft-libs", rev = "5ee3df0f6a9b0fbb55718515bce9d5eb5ab8d1db", features = ["system_fonts"] }
craft-window = { git = "https://github.com/corail-labs/craft-libs", rev = "5ee3df0f6a9b0fbb55718515bce9d5eb5ab8d1db", features = ["egui"] }

# The suite's fork of egui, at the revision that craft-libs pins (`[patch.crates-io]` below). No default fonts:
# the canvas and the app install their own (architecture 11.5).
egui = { version = "0.37", default-features = false }
eframe = { version = "0.37", default-features = false, features = ["accesskit", "clipboard", "wayland", "wgpu", "x11"] }

# foundation
ctrlc = "3.4"
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
postcard = { version = "1", default-features = false, features = ["alloc"] }
# The text of the `Text` panel (kit-text; decision of the owner, 2026-11-21). Lines end at LF only, as `format` reads
# them: no `unicode_lines`, no `cr_lines`.
ropey = { version = "1.6", default-features = false, features = ["simd"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
toml = { version = "1", default-features = false, features = ["parse", "serde"] }
toml_parser = { version = "1", default-features = false }
toml_edit = { version = "0.25", default-features = false, features = ["parse", "display"] }
unicode-normalization = "0.1"
unicode-properties = { version = "0.1", default-features = false, features = ["general-category"] }

# tooling
serde_json = { version = "1", features = ["preserve_order"] }
zmij = "1"
wasm-bindgen-test = "0.3"
# Tests of the window without a window: frames driven, the AccessKit tree read, a render on wgpu.
egui_kittest = { version = "0.37", default-features = false, features = ["wgpu"] }
# The SVG loader, for the icons of the window (Lucide, `assets/icons/lucide/`).
egui_extras = { version = "0.37", default-features = false, features = ["svg"] }

# The web viewer (apps/labcraft-web), in the browser only.
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = "0.3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

# Dependencies are optimized and our crates are not: tests stay quick to build and quick to run.
[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.dev]
debug = "line-tables-only"

[profile.release]
# `check` reports a bug on one function as LC0099 and goes on, under catch_unwind (architecture, 5).
panic = "unwind"
lto = "thin"

# The egui of the Craft suite: the fork at the revision of craft-libs (architecture 11.4).
[patch.crates-io]
ecolor = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
emath = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
eframe = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui-winit = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_kittest = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui-wgpu = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_extras = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
winit = { git = "https://github.com/storytold/winit.git", rev = "a517b3846ee8457d84ee4975110bfda6797c44dc" }
