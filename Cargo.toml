[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "libs/embedded", "tests/harness", "xtask"]

[workspace.package]
version = "0.1.0-m0a"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
# internal
labcraft-types = { path = "crates/types" }
labcraft-graph = { path = "crates/graph" }
labcraft-format = { path = "crates/format" }
labcraft-check = { path = "crates/check" }
labcraft-trace = { path = "crates/trace" }
labcraft-ir = { path = "crates/ir" }
labcraft-runtime = { path = "crates/runtime" }
labcraft-diagram = { path = "crates/diagram" }
labcraft-libs = { path = "libs/embedded" }

# Every crate of craft-libs comes from one revision, as in the Craft apps.
craft-atomic = { git = "https://github.com/storytold/craft-libs", rev = "2e2312ddaf21bc3d85cd3395d0955c7d239306f6" }

# foundation
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
toml = { version = "1", default-features = false, features = ["parse", "serde"] }
unicode-normalization = "0.1"
unicode-properties = { version = "0.1", default-features = false, features = ["general-category"] }

# tooling
serde_json = "1"
wasm-bindgen-test = "0.3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

# Dependencies are optimized and our crates are not: tests stay quick to build and quick to run.
[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.dev]
debug = "line-tables-only"

[profile.release]
# `check` reports a bug on one function as LC0099 and goes on, under catch_unwind (architecture, 5).
panic = "unwind"
lto = "thin"
